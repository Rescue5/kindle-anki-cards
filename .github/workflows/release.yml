name: Release

# Builds the Windows installer on a clean runner. Push a tag such as v0.2.0 to
# attach it to a draft GitHub release, or run manually to get it as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Build the bundled Python bridge
        run: python packaging/build_bridge.py

      - name: Build the installer
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: kindle-cards-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe

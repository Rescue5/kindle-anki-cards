name: Release

# Builds a Windows installer artifact on explicit manual request. Promotion of
# an accepted installer is a separate owner-controlled operation.
on:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Block public 1.0.0 until model distribution is approved
        shell: pwsh
        run: |
          $pythonVersion = [regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $pythonVersion) { throw "Could not read Python package version from pyproject.toml" }
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($pythonVersion -ne $tauriVersion) { throw "Package version mismatch: Python=$pythonVersion Tauri=$tauriVersion" }
          if ($tauriVersion -eq "1.0.0") { throw "Public 1.0.0 is blocked until expanded-model redistribution is approved and explicitly packaged." }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci

      - name: Build the public Python bridge without the private RP-V2 model
        run: python packaging/build_bridge.py --public-release

      - name: Build the installer
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: kindle-cards-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

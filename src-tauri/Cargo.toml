[package]
name = "kindle-cards"
version = "0.1.0"
description = "Kindle Vocabulary Builder words as Anki cards with the book context"
authors = ["Gwyndolin"]
license = "MIT"
repository = "https://github.com/Rescue5/kindle-anki-cards"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

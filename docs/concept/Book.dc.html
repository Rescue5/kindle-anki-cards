<style>
body{margin:0;background:#0d1117}

.kc-nav:hover{color:var(--ink-2);background:rgba(255,224,180,.05)}
.kc-nav[aria-current]{color:var(--ink)}

.kc-seg{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font:400 15px/1 'Literata',Georgia,serif;cursor:pointer;transition:background-color .2s,color .2s,transform .12s}

.kc-seg:active{transform:scale(.97)}
.kc-seg[aria-pressed="true"]{color:var(--ink)}
.kc-seg[aria-pressed="true"] .frame path{stroke:var(--lamp);stroke-width:1.4}
.kc-seg:not([aria-pressed="true"]) .frame{display:none}
.kc-tab{position:relative;display:inline-flex;align-items:baseline;gap:8px;min-height:46px;padding:0 4px;border:0;background:none;color:var(--ink-3);font:400 16px/1 'Literata',Georgia,serif;cursor:pointer;transition:color .2s}

.tab-mark{position:absolute;left:-2px;bottom:5px;width:calc(100% + 4px);height:6px;overflow:visible;display:none}
.kc-tab[aria-selected="true"] .tab-mark{display:block}
.tab-mark path{fill:none;stroke:var(--lamp);stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.kc-tab[aria-selected="true"] span{color:var(--lamp-ink)}
.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

.kc-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 2px;color:var(--ink-2);font:400 15px/1 'Literata',Georgia,serif;text-decoration:underline;text-decoration-color:var(--line-2);text-decoration-thickness:1px;text-underline-offset:6px;transition:color .2s,text-decoration-color .2s}
.kc-link:hover{color:var(--ink);text-decoration-color:var(--lamp)}
.kc-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 8px 11px;border-radius:8px;color:var(--ink-2);text-decoration:none;transition:background-color .2s}
.kc-row:hover{color:var(--ink-2);background:rgba(255,224,180,.045)}
.kc-row:hover .kc-lemma{color:var(--lamp-ink)}
.kc-row:active{transform:scale(.996)}
.mark{font:500 19px/1 'Caveat',cursive;color:var(--ink-2);white-space:nowrap}
.mark.hot{color:var(--lamp-ink);text-decoration:underline;text-decoration-color:rgba(246,181,74,.55);text-decoration-thickness:1.5px;text-underline-offset:5px}
.hand{font-family:'Caveat',cursive;color:var(--ink-2)}
.kc-nav:focus-visible,.kc-seg:focus-visible,.kc-tab:focus-visible,.kc-link:focus-visible,.kc-row:focus-visible{outline:1.5px dashed var(--line-2);outline-offset:4px}
.kc-nav:active,.kc-tab:active{transform:scale(.985)}
.kc-link:active{transform:scale(.97)}
.kc-seg:disabled,.kc-tab:disabled{opacity:.45;cursor:not-allowed;transform:none}
.lamp-host{position:relative;isolation:isolate}
:where(.lamp-host > :not(.lamp)){position:relative;z-index:1}
.lamp{position:absolute;pointer-events:none}
.lamp-strokes{fill:none;stroke:rgba(228,218,200,.8);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.lamp-cast{fill:rgba(0,0,0,.6);filter:blur(5px)}
.lamp-mouth{fill:#ffe1ae;stroke:rgba(228,218,200,.85);stroke-width:1.3;transition:fill .6s}
.lamp-halo{fill:#ffe1ae;filter:blur(7px)}
.lamp-light{animation:lamp-warm .9s ease-out both;transition:opacity .7s}
@keyframes lamp-warm{0%{opacity:0}22%{opacity:.85}32%{opacity:.35}60%{opacity:1}100%{opacity:1}}
.lamp-bloom{border-radius:50%;mix-blend-mode:screen;z-index:3;background:radial-gradient(closest-side,rgba(255,225,174,.85) 0,rgba(255,202,128,.38) 35%,rgba(250,183,66,.1) 70%,transparent 100%)}
.lamp-pool{transition:opacity .7s}
.is-off .lamp-light{animation:none;opacity:0}
.is-off .lamp-mouth{fill:#0d1117}
.is-off .lamp-pool{opacity:0}
.bank-drawing{right:0;bottom:0;z-index:2;width:calc(360px*var(--lamp-s));height:calc(300px*var(--lamp-s));overflow:visible}

.bank-pool{inset:0;background:radial-gradient(ellipse calc(640px*var(--lamp-s)) calc(240px*var(--lamp-s)) at calc(100% - 300px*var(--lamp-s)) 100%,rgba(250,183,66,.17),transparent 75%)}
.bank-bloom{right:calc(56px*var(--lamp-s));bottom:calc(128px*var(--lamp-s));width:calc(250px*var(--lamp-s));height:calc(64px*var(--lamp-s))}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 'reading' };
  }
  renderVals() {
    const st = this.state;
    const NOTES = {
      reading: 'Пока читаете, её слова стоят в рейтинге выше: встретятся на следующих страницах',
      finished: 'Дочитана — её слова больше не поднимаются выше остальных',
      paused: 'Отложена — её слова не поднимаются выше, пока не вернётесь к ней'
    };
    const words = [['linger', 'гл.', 'задерживаться, медлить', 'искали 3 раза', true], ['flinch', 'гл.', 'вздрагивать', 'в трёх ваших книгах', true], ['glimpse', 'сущ., гл.', 'проблеск; мельком увидеть', 'в двух ваших книгах', false], ['dread', 'сущ.', 'страх, ужас', 'частое', false], ['stern', 'прил.', 'строгий, суровый', 'частое', false]];
    return {
      deskCls: st.status === 'reading' ? 'lamp-host desk' : 'lamp-host desk is-off',
      statuses: [['reading', 'Читаю'], ['finished', 'Дочитана'], ['paused', 'Отложена']].map(([id, label]) => ({ label, pressed: st.status === id, pick: () => this.setState({ status: id }) })),
      statusNote: NOTES[st.status],
      spark: [5.1, 3.9, 3.2, 2.9, 2.7, 0, 0, 0, 0, 0].map((v, i) => v ? { h: Math.round(v / 5.1 * 34) + 'px', fill: i === 4 ? 'var(--lamp)' : 'rgba(226,214,192,.5)', edge: 'none' } : { h: '4px', fill: 'transparent', edge: 'inset 0 0 0 1px rgba(226,214,192,.25)' }),
      rows: words.map(([word, pos, meaning, mark, hot]) => ({ word, pos, meaning, mark, cls: hot ? 'mark hot' : 'mark' }))
    };
  }
}
</script>
